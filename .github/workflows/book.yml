name: Book badminton court

on:
  schedule:
    # Every 5 min (GitHub's minimum; runs often start a few minutes late).
    - cron: "*/5 * * * *"
    # Monthly keep-alive: GitHub pauses schedules in public repos after 60 days without activity.
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be booked"
        type: boolean
        default: true
      test_email:
        description: "Only send a test email"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  book:
    if: github.event.schedule != '0 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: book
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Days you've had a reservation on (hashed), so cancelled days aren't re-booked.
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - id: bot
        run: python bot.py ${{ inputs.test_email && '--test-email' || '' }}
        env:
          BASKALKA_USERNAME: ${{ secrets.BASKALKA_USERNAME }}
          BASKALKA_PASSWORD: ${{ secrets.BASKALKA_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          EARLIEST_START: ${{ vars.EARLIEST_START || '17:30' }}
          LATEST_START: ${{ vars.LATEST_START || '20:00' }}
          MIN_LEAD_HOURS: ${{ vars.MIN_LEAD_HOURS || '27' }}
          MAX_DAYS: ${{ vars.MAX_DAYS || '14' }}
          DAYS: ${{ vars.DAYS || 'Mon,Tue,Wed,Thu,Fri' }}
          DURATION_MIN: ${{ vars.DURATION_MIN || '60' }}
      - uses: actions/cache/save@v4
        if: always() && steps.bot.outputs.state_changed == 'true'
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

  keepalive:
    if: github.event.schedule == '0 4 1 * *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/book.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
